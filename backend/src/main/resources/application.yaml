spring:
  application:
    name: eventflow
  datasource:
    url: jdbc:h2:file:./eventflowdb;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnly_MustBeAtLeast256BitsLong!}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
